<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solutions Architect Associate Study Coach</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <header class="mobile-topbar">
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu">☰</button>
    <div class="mobile-topbar-title">Solutions Architect Associate</div>
  </header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-badge">
          <img class="aws-mark" src="assets/aws-logo.png" alt="AWS">
        </div>
        <div class="brand-sub">Solutions Architect Associate</div>
        <div class="brand-tag">Study Coach</div>
      </div>
      <nav id="nav">
        <button data-route="dashboard" class="active">Dashboard</button>
        <button data-route="lessons">Lessons</button>
        <button data-route="practice">Practice</button>
        <button data-route="mock">Exam Simulator</button>
        <button data-route="review">Review (Spaced Repetition)</button>
        <button data-route="flashcards">Flashcards</button>
        <button data-route="plan">Study Plan</button>
      </nav>
      <div class="sidebar-footer">
        <p>120 original practice questions (incl. multi-response) &middot; official domain weighting &middot; not real/leaked exam content</p>
        <p>Unofficial study tool &middot; not affiliated with or endorsed by Amazon Web Services, Inc.</p>
      </div>
    </aside>
    <main id="app-content"></main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
